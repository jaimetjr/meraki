<section class="w-full section-padding bg-white">
  <div class="container-max">
    <div class="flex flex-col items-center justify-center space-y-4 text-center">
      <div class="space-y-2 fade-in">
        <div class="inline-block rounded-lg bg-green-100 px-3 py-1 text-sm text-green-700" #titleEffect>FAQ</div>
        <h2 class="text-3xl font-bold tracking-tighter sm:text-5xl text-green-800">
          Perguntas Frequentes
        </h2>
        <p class="max-w-[900px] text-gray-600 md:text-xl/relaxed lg:text-base/relaxed xl:text-xl/relaxed">
          Tire suas dúvidas sobre nossos tratamentos e serviços.
        </p>
      </div>
    </div>
    
    <div class="mx-auto max-w-4xl py-12">
      <div class="space-y-4">
        @for (faq of faqs; track $index) {
          <div class="border border-gray-200 rounded-lg overflow-hidden">
            <button 
              (click)="toggleItem($index)"
              class="w-full px-6 py-4 text-left bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-inset transition-colors duration-200"
              [attr.aria-expanded]="isExpanded($index)"
              [attr.aria-controls]="'faq-answer-' + $index"
              [attr.id]="'faq-question-' + $index"
            >
              <div class="flex items-center justify-between">
                <h3 class="text-lg font-medium text-gray-900">{{faq.question}}</h3>
                <svg 
                  xmlns="http://www.w3.org/2000/svg" 
                  width="20" 
                  height="20" 
                  viewBox="0 0 24 24" 
                  fill="none" 
                  stroke="currentColor" 
                  stroke-width="2" 
                  stroke-linecap="round" 
                  stroke-linejoin="round" 
                  class="text-gray-500 transition-transform duration-200"
                  [class.rotate-180]="isExpanded($index)"
                >
                  <polyline points="6 9 12 15 18 9" />
                </svg>
              </div>
            </button>
            @if (isExpanded($index)) {
              <div 
                [id]="'faq-answer-' + $index"
                [attr.aria-labelledby]="'faq-question-' + $index"
                class="px-6 pb-4 bg-gray-50"
                role="region"
              >
                <p class="text-gray-600 leading-relaxed">{{faq.answer}}</p>
              </div>
            }
          </div>
        }
      </div>
    </div>
  </div>
</section>
