<section id="therapists" class="w-full section-padding bg-green-50">
  <div class="container-max">
    <div class="flex flex-col items-center justify-center space-y-4 text-center">
      <div class="space-y-2 fade-in">
        <div class="inline-block rounded-lg bg-green-100 px-3 py-1 text-sm text-green-700" #titleEffect data-scroll-anchor>
          Nossa Equipe
        </div>
        <h2 class="text-3xl font-bold tracking-tighter sm:text-5xl text-green-800">
          Conheça Nossos Terapeutas
        </h2>
        <p class="max-w-[900px] text-gray-600 md:text-xl/relaxed lg:text-base/relaxed xl:text-xl/relaxed">
          Profissionais dedicados e qualificados, prontos para cuidar da sua saúde de forma integral.
        </p>
      </div>
    </div>
    @if (isLoading()) {
      <div class="mx-auto grid max-w-5xl gap-6 py-12 lg:grid-cols-3">
        @for (i of [1,2,3,4,5,6]; track i) {
          <div class="flex flex-col items-center space-y-4 border rounded-lg p-6 bg-white shadow-sm">
            <div class="w-24 h-24 rounded-full skeleton"></div>
            <div class="w-32 h-4 skeleton rounded"></div>
            <div class="w-24 h-3 skeleton rounded"></div>
            <div class="w-full space-y-2">
              <div class="w-full h-3 skeleton rounded"></div>
              <div class="w-3/4 h-3 skeleton rounded"></div>
            </div>
          </div>
        }
      </div>
    } @else {
      <div class="mx-auto grid max-w-5xl gap-6 py-12 lg:grid-cols-3">
        @for (therapist of therapists(); track therapist.id) {
          <app-therapist-card [therapist]="therapist"></app-therapist-card>
        }
      </div>
    }
  </div>
</section>
