<div class="border rounded-lg p-6 shadow-sm bg-white card-hover">
  <app-image-or-initials
    [src]="service().image"
    [alt]="'Imagem do serviço ' + service().name"
    [label]="service().name"
    imageClass="w-full h-48 object-cover rounded-lg mb-4"
    placeholderClass="w-full h-48 rounded-lg mb-4 flex items-center justify-center bg-green-50 text-green-700 text-4xl font-semibold"
  ></app-image-or-initials>
  <div class="space-y-3">
    <h3 class="text-xl font-bold text-green-700">{{service().name}}</h3>
    <p class="text-gray-600 leading-relaxed">{{service().description}}</p>
    <div class="flex items-center justify-between text-sm text-gray-500 pt-2 border-t">
      @if (service().duration) {
        <span class="flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          {{service().duration}}
        </span>
      } @else {
        <span></span>
      }
      <span class="font-medium text-green-700">
        @if (service().price !== null) {
          {{ service().price | currency:service().currency }}
        } @else {
          Sob consulta
        }
      </span>
    </div>
    <button (click)="openDialog()" class="w-full btn-secondary cursor-pointer">
      Saiba Mais
    </button>
  </div>
</div>
