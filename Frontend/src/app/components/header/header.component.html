<header class="w-full border-b bg-white" role="banner">
    <div class="container mx-auto max-w-7xl flex h-16 items-center justify-between px-4">
      <a routerLink="/" class="flex items-center gap-2" aria-label="Meraki Saúde Integrativa - Página inicial">
        <img [ngSrc]="logoUrl" alt="" width="50" height="50" priority class="rounded-full object-contain" role="presentation">
        <span class="text-xl font-bold text-green-700">Meraki Saúde Integrativa</span>
      </a>
      <nav class="hidden md:flex gap-6" role="navigation" aria-label="Navegação principal">
        <a href="/" (click)="go($event, 'about')" class="text-sm font-medium text-green-700 hover:text-green-500 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 rounded px-2 py-1">
          Sobre
        </a>
        <a href="/" (click)="go($event, 'therapists')" class="text-sm font-medium text-green-700 hover:text-green-500 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 rounded px-2 py-1">
          Terapeutas
        </a>
        <a href="/" (click)="go($event, 'services')" class="text-sm font-medium text-green-700 hover:text-green-500 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 rounded px-2 py-1">
          Serviços
        </a>
        <a routerLink="/cursos" class="text-sm font-medium text-green-700 hover:text-green-500 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 rounded px-2 py-1">
          Cursos
        </a>
        <a href="/" (click)="go($event, 'contact')" class="text-sm font-medium text-green-700 hover:text-green-500 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 rounded px-2 py-1">
          Contato
        </a>
      </nav>
      <button 
        class="md:hidden focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 rounded p-2" 
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen"
        [attr.aria-label]="isMenuOpen ? 'Fechar menu' : 'Abrir menu'"
        [attr.aria-controls]="'mobile-menu'"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-700" aria-hidden="true">
          @if (isMenuOpen) {
            <line x1="18" x2="6" y1="6" y2="18" />
            <line x1="6" x2="18" y1="6" y2="18" />
          } @else {
            <line x1="4" x2="20" y1="12" y2="12" />
            <line x1="4" x2="20" y1="6" y2="6" />
            <line x1="4" x2="20" y1="18" y2="18" />
          }
        </svg>
        <span class="sr-only">{{ isMenuOpen ? 'Fechar menu' : 'Abrir menu' }}</span>
      </button>
    </div>
    <!-- Mobile menu -->
    @if (isMenuOpen) {
      <div id="mobile-menu" class="md:hidden bg-white border-t" role="navigation" aria-label="Menu móvel">
        <div class="container mx-auto px-4 py-2">
          <nav class="flex flex-col space-y-2">
            <a href="/" (click)="go($event, 'about', true)" class="py-2 text-sm font-medium text-green-700 hover:text-green-500 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 rounded px-2">
              Sobre
            </a>
            <a href="/" (click)="go($event, 'therapists', true)" class="py-2 text-sm font-medium text-green-700 hover:text-green-500 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 rounded px-2">
              Terapeutas
            </a>
            <a href="/" (click)="go($event, 'services', true)"  class="py-2 text-sm font-medium text-green-700 hover:text-green-500 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 rounded px-2">
              Serviços
            </a>
            <a routerLink="/cursos" class="py-2 text-sm font-medium text-green-700 hover:text-green-500 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 rounded px-2" (click)="toggleMenu()">
              Cursos
            </a>
            <a href="/" (click)="go($event, 'contact', true)"  class="py-2 text-sm font-medium text-green-700 hover:text-green-500 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 rounded px-2">
              Contato
            </a>
          </nav>
        </div>
      </div>
    }
  </header>
