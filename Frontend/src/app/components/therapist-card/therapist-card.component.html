<div class="flex flex-col items-center space-y-4 border rounded-lg p-6 bg-white shadow-sm card-hover">
  <app-image-or-initials
    [src]="therapist().image"
    [alt]="'Foto de ' + therapist().name"
    [label]="therapist().name"
    imageClass="w-24 h-24 rounded-full object-cover shadow-md"
    placeholderClass="w-24 h-24 rounded-full shadow-md flex items-center justify-center bg-green-100 text-green-700 text-2xl font-semibold"
  ></app-image-or-initials>
  <div class="text-center space-y-2">
    <h3 class="text-lg font-bold text-green-700">{{therapist().name}}</h3>
    @if (servicesLine()) {
      <p class="text-sm text-green-600 font-medium">{{ servicesLine() }}</p>
    }
    <p class="text-xs text-gray-500">{{therapist().experience}} de experiência</p>
  </div>
  <p class="text-sm text-gray-600 text-center leading-relaxed">
    {{therapist().bio}}
  </p>
  @if (therapist().education) {
    <div class="w-full space-y-2">
      <p class="text-xs font-medium text-green-700">Formação:</p>
      <p class="text-xs text-gray-600">{{therapist().education}}</p>
    </div>
  }
</div>
