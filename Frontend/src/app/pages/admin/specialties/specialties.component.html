<app-admin-panel
  title="Especialidades"
  description="Gerencie especialidades para terapeutas."
>
  <div class="actions">
    <div class="search">
      <input placeholder="Buscar..." [value]="searchTerm()" (input)="searchTerm.set($any($event.target).value)" />
      <button class="btn-ghost" (click)="search()">Buscar</button>
    </div>
    <button class="btn-primary" (click)="startCreate()">Nova especialidade</button>
  </div>

  @if (error()) {
    <div class="alert">{{ error() }}</div>
  }

  @if (loading()) {
    <app-admin-loading></app-admin-loading>
  } @else if (specialties().length === 0) {
    <app-admin-empty message="Nenhuma especialidade cadastrada."></app-admin-empty>
  } @else {
    <div class="table">
      <div class="table-head">
        <div>Nome</div>
        <div>Descrição</div>
        <div>Ações</div>
      </div>
      @for (item of specialties(); track item.id) {
        <div class="table-row">
          <div class="title">{{ item.name }}</div>
          <div class="muted">{{ item.description }}</div>
          <div class="row-actions">
            <button class="btn-ghost" (click)="startEdit(item)">Editar</button>
            <button class="btn-danger" (click)="confirmDelete(item.id!)">Excluir</button>
          </div>
        </div>
      }
    </div>
  }

  @if (editingId() !== null || isCreating()) {
    <app-admin-form-modal
      [title]="editingId() ? 'Editar especialidade' : 'Nova especialidade'"
      [visible]="true"
      (close)="cancelEdit()"
    >
      <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
        <label>
          <span>Nome*</span>
          <input 
            formControlName="name"
            [class.border-red-500]="form.get('name')?.invalid && form.get('name')?.touched"
          />
          @if (form.get('name')?.invalid && form.get('name')?.touched) {
            <p class="text-sm text-red-600">
              @if (form.get('name')?.errors?.['required']) {
                Nome é obrigatório.
              } @else if (form.get('name')?.errors?.['maxlength']) {
                Nome deve ter no máximo 100 caracteres.
              }
            </p>
          }
        </label>
        <label class="col-span-2">
          <span>Descrição</span>
          <textarea 
            rows="3" 
            formControlName="description"
            [class.border-red-500]="form.get('description')?.invalid && form.get('description')?.touched"
          ></textarea>
          @if (form.get('description')?.invalid && form.get('description')?.touched) {
            <p class="text-sm text-red-600">
              Descrição deve ter no máximo 500 caracteres.
            </p>
          }
        </label>

        <app-admin-form-actions
          [disableSave]="saving()"
          (cancel)="cancelEdit()"
          saveLabel="Salvar especialidade"
        ></app-admin-form-actions>
      </form>
    </app-admin-form-modal>
  }

  @if (confirmId()) {
    <app-admin-confirm-dialog
      title="Excluir especialidade"
      message="Esta ação não pode ser desfeita."
      confirmLabel="Excluir"
      cancelLabel="Cancelar"
      (confirm)="delete(confirmId()!)"
      (cancel)="confirmId.set(null)"
    />
  }
</app-admin-panel>
