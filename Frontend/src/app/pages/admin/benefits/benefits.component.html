<app-admin-panel
  title="Benefícios"
  description="Gerencie benefícios e associe-os a serviços."
>
  <div class="actions">
    <div class="search">
      <input placeholder="Buscar..." [value]="searchTerm()" (input)="searchTerm.set($any($event.target).value)" />
      <button class="btn-ghost" (click)="search()">Buscar</button>
    </div>
    <button class="btn-primary" (click)="startCreate()">Novo benefício</button>
  </div>

  @if (error()) {
    <div class="alert">{{ error() }}</div>
  }

  @if (loading()) {
    <app-admin-loading></app-admin-loading>
  } @else if (benefits().length === 0) {
    <app-admin-empty message="Nenhum benefício cadastrado."></app-admin-empty>
  } @else {
    <div class="table">
      <div class="table-head">
        <div>Título</div>
        <div>Descrição</div>
        <div>Ações</div>
      </div>
      @for (item of benefits(); track item.id) {
        <div class="table-row">
          <div class="title">{{ item.title }}</div>
          <div class="muted">{{ item.description }}</div>
          <div class="row-actions">
            <button class="btn-ghost" (click)="startEdit(item)">Editar</button>
            <button class="btn-danger" (click)="confirmDelete(item.id!)">Excluir</button>
          </div>
        </div>
      }
    </div>
  }

  @if (editingId() !== null || isCreating()) {
    <app-admin-form-modal
      [title]="editingId() ? 'Editar benefício' : 'Novo benefício'"
      [visible]="true"
      (close)="cancelEdit()"
    >
      <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
        <label>
          <span>Título*</span>
          <input 
            formControlName="title"
            [class.border-red-500]="form.get('title')?.invalid && form.get('title')?.touched"
          />
          @if (form.get('title')?.invalid && form.get('title')?.touched) {
            <p class="text-sm text-red-600">
              @if (form.get('title')?.errors?.['required']) {
                Título é obrigatório.
              } @else if (form.get('title')?.errors?.['maxlength']) {
                Título deve ter no máximo 200 caracteres.
              }
            </p>
          }
        </label>
        <label class="col-span-2">
          <span>Descrição</span>
          <textarea 
            rows="3" 
            formControlName="description"
            [class.border-red-500]="form.get('description')?.invalid && form.get('description')?.touched"
          ></textarea>
          @if (form.get('description')?.invalid && form.get('description')?.touched) {
            <p class="text-sm text-red-600">
              Descrição deve ter no máximo 1000 caracteres.
            </p>
          }
        </label>

        <app-admin-form-actions
          [disableSave]="saving()"
          (cancel)="cancelEdit()"
          saveLabel="Salvar benefício"
        ></app-admin-form-actions>
      </form>
    </app-admin-form-modal>
  }

  @if (confirmId()) {
    <app-admin-confirm-dialog
      title="Excluir benefício"
      message="Esta ação não pode ser desfeita."
      confirmLabel="Excluir"
      cancelLabel="Cancelar"
      (confirm)="delete(confirmId()!)"
      (cancel)="confirmId.set(null)"
    />
  }
</app-admin-panel>
