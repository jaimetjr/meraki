<app-admin-panel
  title="Categorias"
  description="Gerencie categorias usadas em serviços e cursos."
>
  <div class="actions">
    <button class="btn-primary" (click)="startCreate()">Nova categoria</button>
  </div>

  @if (error()) {
    <div class="alert">{{ error() }}</div>
  }

  @if (loading()) {
    <app-admin-loading></app-admin-loading>
  } @else if (categories().length === 0) {
    <app-admin-empty message="Nenhuma categoria cadastrada."></app-admin-empty>
  } @else {
    <div class="table">
      <div class="table-head">
        <div>Nome</div>
        <div>Ações</div>
      </div>
      @for (item of categories(); track item.id) {
        <div class="table-row">
          <div>
            <p class="title">{{ item.name }}</p>
            <p class="muted">{{ item.id }}</p>
          </div>
          <div class="row-actions">
            <button class="btn-ghost" (click)="startEdit(item)">Editar</button>
            <button class="btn-danger" (click)="confirmDelete(item.id!)">Excluir</button>
          </div>
        </div>
      }
    </div>
  }

  @if (editingId() !== null || isCreating()) {
    <app-admin-form-modal
      [title]="editingId() ? 'Editar categoria' : 'Nova categoria'"
      [visible]="true"
      (close)="cancelEdit()"
    >
      <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
        <label class="col-span-2">
          <span>Nome*</span>
          <input 
            formControlName="name"
            [class.border-red-500]="form.get('name')?.invalid && form.get('name')?.touched"
          />
          @if (form.get('name')?.invalid && form.get('name')?.touched) {
            <p class="text-sm text-red-600">
              @if (form.get('name')?.errors?.['required']) {
                Nome é obrigatório.
              } @else if (form.get('name')?.errors?.['maxlength']) {
                Nome deve ter no máximo 100 caracteres.
              }
            </p>
          }
        </label>

        <app-admin-form-actions
          [disableSave]="saving()"
          (cancel)="cancelEdit()"
          saveLabel="Salvar categoria"
        ></app-admin-form-actions>
      </form>
    </app-admin-form-modal>
  }

  @if (confirmId()) {
    <app-admin-confirm-dialog
      title="Excluir categoria"
      message="Esta ação não pode ser desfeita."
      confirmLabel="Excluir"
      cancelLabel="Cancelar"
      (confirm)="delete(confirmId()!)"
      (cancel)="confirmId.set(null)"
    />
  }
</app-admin-panel>
